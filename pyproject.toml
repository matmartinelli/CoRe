[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CoRe"
version = "0.1.0"
description = "Cosmological Regressor"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # List any third-party dependencies your code needs to run, e.g.:
    # "numpy>=1.20.0",
    # "pandas>=1.3.0",
    # "seaborn>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["CoRe*"]
